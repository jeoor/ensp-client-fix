name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/test.yml
  publish:
    needs: verify
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify package
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $package = .\scripts\New-Release.ps1 -Version $env:RELEASE_TAG
          .\tests\Test-Release.ps1 -ArchivePath $package.ArchivePath
          "ARCHIVE_PATH=$($package.ArchivePath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHECKSUM_PATH=$($package.ChecksumPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = @'
          一次性修复 eNSP 的窗口拖动效果与剪贴板释放问题。

          下载 ZIP 并完整解压，使用 检查.bat、修复.bat、还原.bat。
          支持经过完整文件哈希核对的 eNSP 1.3.00.100，修复前保存原文件备份。
          '@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          $arguments = @('release','create',$env:RELEASE_TAG,$env:ARCHIVE_PATH,$env:CHECKSUM_PATH,
            '--repo',$env:GITHUB_REPOSITORY,'--verify-tag','--title',$env:RELEASE_TAG,'--notes-file',$notesPath)
          if ($env:RELEASE_TAG.Contains('-')) { $arguments += '--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
